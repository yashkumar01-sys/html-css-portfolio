
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Size Chart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h1>T-Shirt Size Chart</h1>

    <table>
        <tr>
            <th>Size</th>
            <th>Chest (inches)</th>
            <th>Length (inches)</th>
            <th>Shoulder (inches)</th>
        </tr>

        <tr>
            <td>S</td>
            <td>36</td>
            <td>26</td>
            <td>16</td>
        </tr>

        <tr>
            <td>M</td>
            <td>38</td>
            <td>27</td>
            <td>17</td>
        </tr>

        <tr>
            <td>L</td>
            <td>40</td>
            <td>28</td>
            <td>18</td>
        </tr>

        <tr>
            <td>XL</td>
            <td>42</td>
            <td>29</td>
            <td>19</td>
        </tr>
    </table>

</body>
</html>
