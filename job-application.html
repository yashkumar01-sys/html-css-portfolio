
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="time">Interview Time:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label for="month">Available From:</label>
        <input type="month" id="month" name="month">
        <br><br>

        <label for="website">Portfolio URL:</label>
        <input type="url" id="website" name="website">
        <br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>

        <p>Skills:</p>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>
        <br><br>

        <label for="role">Job Role:</label>
        <select id="role" name="role">
            <option>Web Developer</option>
            <option>Software Developer</option>
            <option>Data Analyst</option>
        </select>
        <br><br>

        <label for="color">Choose a theme color:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <label for="experience">Experience Level:</label>
        <input type="range" id="experience" name="experience" min="0" max="10">
        <br><br>

        <label for="message">Why should we hire you?</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea>
        <br><br>

        <input type="hidden" name="formType" value="jobApplication">

        <input type="search" name="search" placeholder="Search job title">
        <br><br>

        <input type="week" name="week">
        <br><br>

        <input type="datetime-local" name="interviewDateTime">
        <br><br>

        <input type="submit" value="Apply Now">
        <input type="reset" value="Clear Form">
        <br><br>

        <input type="button" value="Click Me" onclick="alert('Application Form')">
    </form>

</body>
</html>
