
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>
        /* 1. Element selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 30px;
        }

        /* 2. Element selector */
        h1 {
            color: blue;
            text-align: center;
        }

        /* 3. Class selector */
        .intro {
            color: green;
            font-size: 18px;
        }

        /* 4. ID selector */
        #footer {
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* 5. Descendant selector */
        div p {
            color: darkblue;
        }
    </style>
</head>

<body>
    <h1>My Personal Page</h1>

    <p class="intro">Hello! My name is Yash.</p>

    <div>
        <p>I am learning HTML and CSS.</p>
    </div>

    <p>I want to become a software developer.</p>

    <footer id="footer">
        Thank you for visiting my page!
    </footer>
</body>
</html>
